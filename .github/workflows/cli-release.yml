name: CLI Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/cli/**'
  workflow_dispatch:

jobs:
  lint:
    name: Lint Scripts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          shellcheck --severity=error install.sh
          shellcheck --severity=error kitup.sh

      - name: Lint PowerShell scripts
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path *.ps1
          $hasErrors = $false
          foreach ($script in $scripts) {
            $errors = Invoke-ScriptAnalyzer -Path $script.FullName -Severity Error
            if ($errors) {
              $errors | Format-Table
              $hasErrors = $true
            }
          }
          if ($hasErrors) {
            exit 1
          }

  test:
    name: Test Scripts
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/cli
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Test install script (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x install.sh kitup.sh
          bash -n install.sh
          bash -n kitup.sh

      - name: Test install script (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path *.ps1
          Test-Path -Path install.ps1
          Test-Path -Path kitup.ps1

      - name: Test kitup --help (Unix)
        if: runner.os != 'Windows'
        run: |
          ./kitup.sh --help

      - name: Test kitup --list (Unix)
        if: runner.os != 'Windows'
        run: |
          ./kitup.sh --list

      - name: Test kitup --status (Unix)
        if: runner.os != 'Windows'
        run: |
          ./kitup.sh --status

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  build:
    name: Build ${{ matrix.target }}
    needs: [lint, test, rust]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: kitup-aarch64-apple-darwin.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: kitup-x86_64-apple-darwin.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: kitup-x86_64-unknown-linux-gnu.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: kitup-aarch64-unknown-linux-gnu.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: kitup-x86_64-pc-windows-msvc.zip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install ARM Linux linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/kitup" dist/kitup
          (cd dist && tar -czf "${{ matrix.asset }}" kitup && rm kitup)

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/kitup.exe" dist/kitup.exe
          Compress-Archive -Path dist/kitup.exe -DestinationPath "dist/${{ matrix.asset }}" -Force
          Remove-Item dist/kitup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd packages/cli
          sha256sum install.sh kitup.sh install.ps1 kitup.ps1 > checksums.txt
          cd ../../dist
          sha256sum kitup-*.tar.gz kitup-*.zip >> checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            packages/cli/install.sh
            packages/cli/kitup.sh
            packages/cli/install.ps1
            packages/cli/kitup.ps1
            dist/kitup-*.tar.gz
            dist/kitup-*.zip
            dist/checksums.txt
          generate_release_notes: true
